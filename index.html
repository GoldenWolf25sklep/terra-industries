<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="Terra Industries — przemysłowa gra symulacyjna 3D." />
    <title>Terra Industries</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Świat gry Terra Industries"></canvas>
      <header class="topbar">
        <div class="brand"><span class="brand-mark">T</span><span>TERRA INDUSTRIES</span></div>
        <div class="build-tag">PROTOTYP 0.1</div>
      </header>
      <section class="hud">
        <div class="hud-label">STREFA ROBOCZA</div>
        <div class="hud-title">Sektor 01 <span class="online-dot"></span></div>
        <div class="hud-stats"><span>Żelazo <b id="iron-count">0</b></span><span>Energia <b>—</b></span></div>
      </section>
      <div class="help">Przeciągnij ekran, aby obrócić kamerę · Użyj WASD lub przycisków ruchu</div>
      <div class="mobile-controls" aria-label="Sterowanie dotykowe">
        <button data-move="forward" aria-label="Do przodu">▲</button>
        <div class="control-row">
          <button data-move="left" aria-label="W lewo">◀</button>
          <button data-move="back" aria-label="Do tyłu">▼</button>
          <button data-move="right" aria-label="W prawo">▶</button>
        </div>
      </div>
      <button id="interact-button" class="interact-button">ZBIERZ RUDĘ · E</button>
      <div class="crosshair">+</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
