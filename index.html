<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="Terra Industries — przemysłowa gra symulacyjna 3D." />
    <title>Terra Industries</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Świat gry Terra Industries"></canvas>
      <header class="topbar">
        <div class="brand"><span class="brand-mark">T</span><span>TERRA INDUSTRIES</span></div>
        <div class="build-tag">ALPHA 0.2</div>
      </header>
      <section class="hud">
        <div class="hud-label">STREFA ROBOCZA</div>
        <div class="hud-title">Sektor 01 <span class="online-dot"></span></div>
        <div class="hud-stats"><span>Żelazo <b id="iron-count">0</b></span><span>Stal <b id="steel-count">0</b></span><span>Wsad <b id="ore-buffer-count">0</b></span><span>Huta <b id="smelter-state">BRAK</b></span></div><div id="interaction-status" class="interaction-status">Podejdź do jednego głównego złoża żelaza</div><div id="save-status" class="save-status">Nowa gra · zapis lokalny</div>
      </section>
      <div class="help">Przeciągnij ekran, aby obrócić kamerę · Steruj joystickiem po lewej stronie</div>
      <div id="move-joystick" class="move-joystick" role="application" aria-label="Joystick ruchu">
        <div class="joystick-ring"></div>
        <div id="joystick-knob" class="joystick-knob"></div>
        <span class="joystick-caption">RUCH</span>
      </div>
      <section id="machine-panel" class="machine-panel" hidden aria-live="polite">
        <div id="menu-panel-title" class="menu-panel-title">CENTRUM OPERACYJNE</div>
        <div id="menu-panel-message" class="menu-panel-message">Wybierz zakładkę lub podejdź do maszyny.</div>
        <div id="machine-actions" class="machine-actions" hidden>
          <button id="interact-button" class="interact-button" hidden>WYDOBĄDŹ RUDĘ · E</button>
          <button id="build-machine-button" class="build-machine-button" hidden disabled>KUP KOPARKĘ · 100 ŻELAZA</button>
          <button id="upgrade-machine-button" class="upgrade-machine-button" hidden disabled>ULEPSZ KOPARKĘ</button>
          <button id="build-smelter-button" class="build-smelter-button" hidden disabled>KUP HUTĘ · 250 ŻELAZA</button>
          <button id="build-conveyor-button" class="build-conveyor-button" hidden disabled>KUP TAŚMOCIĄG · 150 STALI</button>
          <button id="upgrade-smelter-button" class="upgrade-machine-button" hidden disabled>ULEPSZ HUTĘ</button>
        </div>
      </section>
      <nav class="bottom-menu" aria-label="Menu główne">
        <button class="bottom-menu-button active" data-tab="home" type="button"><span>⌂</span>BAZA</button>
        <button class="bottom-menu-button" data-tab="machines" type="button"><span>⚙</span>MASZYNY</button>
        <button class="bottom-menu-button" data-tab="storage" type="button"><span>▤</span>MAGAZYN</button>
      </nav>
      <div class="crosshair">+</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
