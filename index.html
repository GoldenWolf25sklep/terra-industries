<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="Terra Industries — przemysłowa gra symulacyjna 3D." />
    <title>Terra Industries</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Świat gry Terra Industries"></canvas>
      <header class="topbar">
        <div class="brand"><span class="brand-mark">T</span><span>TERRA INDUSTRIES</span></div>
        <div class="build-tag">ALPHA 0.2</div>
      </header>
      <section class="hud">
        <div class="hud-label">STREFA ROBOCZA</div>
        <div class="hud-title">Sektor 01 <span class="online-dot"></span></div>
        <div class="hud-stats"><span>Żelazo <b id="iron-count">0</b></span><span>Stal <b id="steel-count">0</b></span><span>Wsad <b id="ore-buffer-count">0</b></span><span>Huta <b id="smelter-state">BRAK</b></span></div><div id="interaction-status" class="interaction-status">Podejdź do jednego głównego złoża żelaza</div><div id="save-status" class="save-status">Nowa gra · zapis lokalny</div>
      </section>
      <div class="help">Przeciągnij ekran, aby obrócić kamerę · Steruj joystickiem po lewej stronie</div>
      <div id="move-joystick" class="move-joystick" role="application" aria-label="Joystick ruchu">
        <div class="joystick-ring"></div>
        <div id="joystick-knob" class="joystick-knob"></div>
        <span class="joystick-caption">RUCH</span>
      </div>
      <div class="action-buttons"><button id="interact-button" class="interact-button">ZBIERZ RUDĘ · E</button><button id="build-machine-button" class="build-machine-button" disabled>ZBUDUJ KOPARKĘ · 100 ŻELAZA</button><button id="build-smelter-button" class="build-smelter-button" disabled>ZBUDUJ HUTĘ · 250 ŻELAZA</button><button id="build-conveyor-button" class="build-conveyor-button" disabled>ZBUDUJ TAŚMOCIĄG · 150 STALI</button></div>
      <div class="crosshair">+</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
