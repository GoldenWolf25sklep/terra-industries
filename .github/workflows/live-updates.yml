name: Publish free GitHub game update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terra-industries-github-update
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build game bundle
        run: npm run build
      - name: Package update
        run: |
          cd dist
          zip -X -r ../terra-live-update.zip .
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "live-${{ github.run_number }}" terra-live-update.zip \
            --title "Terra Industries live update ${{ github.run_number }}" \
            --notes "Automatyczna aktualizacja gry. Zainstaluj ją w aplikacji Terra Industries."
